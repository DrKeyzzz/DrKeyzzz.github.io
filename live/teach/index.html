<!-- MTG_MOVE start: carries a browser's saved data from drkeyzzz.github.io to musictheorygames.org and musictheoryacademy.org. Master copy: shared/mtg-move.snippet.html; install with shared/apply-move.py, never edit the copy in a page. -->
<script>
/* musictheoryacademy.org is the one address (David, 2026-10-29: "all go to academy").
   Old address (drkeyzzz.github.io) and musictheorygames.org: pack everything this browser saved there and forward to the same
   page on musictheoryacademy.org (musictheorygames.org first checks the academy loads here; if a school blocks it, the page opens as is).
   musictheoryacademy.org: never leaves. It unpacks arriving data once per source (missing items are added, practice history is
   combined), then reloads clean.
   The data rides after the # in the link, which browsers never send to any server.
   Local test on port 8771: 127.0.0.1 = old, localhost = musictheorygames.org, academy.localhost = musictheoryacademy.org. */
(function () {
  if (window.top !== window.self) return;                       // pages shown inside another page never move
  var host = location.hostname, NEW = 'https://musictheorygames.org', ACAD = 'https://musictheoryacademy.org', OLD = 'https://drkeyzzz' + '.github.io', role = '';
  if (host === 'drkeyzzz.github.io') role = 'old';
  else if (host === 'musictheorygames.org') role = 'new';
  else if (host === 'musictheoryacademy.org') role = 'acad';
  else if (location.port === '8771') {
    NEW = 'http://localhost:8771'; ACAD = 'http://academy.localhost:8771'; OLD = 'http://127.0.0.1:8771';
    role = host === '127.0.0.1' ? 'old' : host === 'localhost' ? 'new' : host === 'academy.localhost' ? 'acad' : '';
  }
  if (!role) return;
  var FLAG = 'mtg_move_v1', TAG = '#mtgmove=', SEND = '#mtgsend=a.', ls = null;   // SEND: older academy pages asked for data this way (still read)
  try { ls = window.localStorage; ls.getItem(FLAG); } catch (e) { ls = null; }
  var page = location.pathname + location.search;
  function halt() { try { window.stop(); } catch (e) {} try { document.documentElement.style.visibility = 'hidden'; } catch (e) {} }
  function skip(k) { return k === FLAG || k === FLAG + '_old' || k.indexOf('mtg_time_lock_v1:') === 0 || k.indexOf('firebase:') === 0; }

  function b64u(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64u(t) {
    var s = atob(t.replace(/-/g, '+').replace(/_/g, '/')), b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
  function pack(data) {
    var json = JSON.stringify(data);
    if (window.CompressionStream && window.Response && window.Blob)
      return new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()
        .then(function (buf) { return 'z' + b64u(new Uint8Array(buf)); });
    return Promise.resolve('j' + b64u(new TextEncoder().encode(json)));
  }
  function unpack(p) {
    if (p === '-' || !p) return Promise.resolve({});
    var bytes = unb64u(p.slice(1));
    if (p.charAt(0) === 'z')
      return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(JSON.parse);
    return Promise.resolve(JSON.parse(new TextDecoder().decode(bytes)));
  }

  // practice history: both addresses recorded different answers, so counts add up and bests take the higher one
  var ADD = { plays: 1, answers: 1, correct: 1, ms: 1, caught: 1 };
  function mergeGame(x, y) {
    for (var f in y) {
      if (f === 'skills') {
        x.skills = x.skills || {};
        for (var lab in y.skills) { var a = x.skills[lab], b = y.skills[lab]; x.skills[lab] = a ? [a[0] + b[0], a[1] + b[1]] : b; }
      } else if (typeof y[f] === 'number') x[f] = typeof x[f] !== 'number' ? y[f] : ADD[f] ? x[f] + y[f] : Math.max(x[f], y[f]);
      else if (!(f in x)) x[f] = y[f];
    }
  }
  function mergeHist(a, b) {
    if (!a || !a.days) return b;
    if (!b || !b.days) return a;
    for (var d in b.days) {
      if (!a.days[d]) { a.days[d] = b.days[d]; continue; }
      for (var g in b.days[d]) { if (!a.days[d][g]) a.days[d][g] = b.days[d][g]; else mergeGame(a.days[d][g], b.days[d][g]); }
    }
    return a;
  }
  function mergeLedger(a, b) {                                    // minutes already sent to the Practice time board, per day
    if (!a || !a.sent) return b;
    if (!b || !b.sent) return a;
    for (var d in b.sent) a.sent[d] = (a.sent[d] || 0) + b.sent[d];
    a.last = Math.max(a.last || 0, b.last || 0);
    return a;
  }
  function merge(data) {
    for (var k in data) {
      if (skip(k)) continue;
      try {
        var cur = ls.getItem(k), v = data[k];
        if (cur === null) ls.setItem(k, v);
        else if (k.indexOf('mtg_hist_v1:') === 0) ls.setItem(k, JSON.stringify(mergeHist(JSON.parse(cur), JSON.parse(v))));
        else if (k.indexOf('mtg_time_sync_v1:') === 0) ls.setItem(k, JSON.stringify(mergeLedger(JSON.parse(cur), JSON.parse(v))));
        // anything else the new address already has stays as it is
      } catch (e) {}
    }
  }

  function send(to, hash, src) {                                  // pack this browser's data and carry it to the same page at `to`
    halt();
    var data = {}, n = 0;
    if (ls) for (var i = 0; i < ls.length; i++) { var k = ls.key(i); if (k && !skip(k)) { data[k] = ls.getItem(k); n++; } }
    (n ? pack(data) : Promise.resolve('-')).then(function (p) { return p; }, function () { return '-'; }).then(function (p) {
      location.replace(to + page + TAG + (src || '') + p + '.' + encodeURIComponent(hash));
    });
  }
  function reach(origin) {                                        // can this browser load the other address? (school filters block some)
    return new Promise(function (ok) {
      var img = new Image(), t = setTimeout(function () { ok(false); }, 4000);
      img.onload = function () { clearTimeout(t); ok(true); };
      img.onerror = function () { clearTimeout(t); ok(false); };
      img.src = origin + '/screenshots/brainwaves.jpg?r=' + Date.now();
    });
  }
  var asked = location.hash.indexOf(SEND) === 0, hash = asked ? decodeURIComponent(location.hash.slice(SEND.length)) : location.hash.replace(/^#/, '');

  var STAY = 'mtg_move_stay';                                     // this tab could not reach musictheoryacademy.org: stay where it is
  var stay = false; try { stay = sessionStorage.getItem(STAY) === '1'; } catch (e) {}

  if (role === 'old') { send(ACAD, hash, 'o'); return; }          // old links go straight to the academy (marked 'o' so both sources can merge once)

  if (role === 'new') {                                           // musictheorygames.org forwards to the academy with its data (or passes data on)
    if (stay) return;
    halt();
    reach(ACAD).then(function (ok) {
      if (!ok) { try { sessionStorage.setItem(STAY, '1'); } catch (e) {} location.reload(); return; }   // the academy is blocked here: open this page
      if (location.hash.indexOf(TAG) === 0) location.replace(ACAD + page + location.hash);
      else send(ACAD, hash);
    });
    return;
  }

  if (location.hash.indexOf(TAG) === 0) {                         // data arriving at the academy: unpack once per source, then reload clean
    halt();
    var rest = location.hash.slice(TAG.length), dot = rest.indexOf('.');
    var p = dot < 0 ? rest : rest.slice(0, dot), orig = dot < 0 ? '' : decodeURIComponent(rest.slice(dot + 1));
    var key = FLAG; if (p.charAt(0) === 'o') { key = FLAG + '_old'; p = p.slice(1); }
    var done = function () {
      history.replaceState(null, '', page + (orig ? '#' + orig : ''));
      location.reload();
    };
    if (!ls || ls.getItem(key) === 'done') { done(); return; }
    unpack(p).then(merge).catch(function () {}).then(function () { try { ls.setItem(key, 'done'); } catch (e) {} done(); });
  }
})();
</script>
<!-- MTG_MOVE end -->

<script>
(() => {
const { OPT_DEF, DIFFS, QGAMES, qgame, makeQ, KS_ORDER, KS_CLEFS, clefOk, ksOk, ksName, ksCount, ksStaff, ksQuestion, PREVIEW, Q, esc, TYPES, EMOJIS, BANK, NOW, at, db, results, latest, left, clock, ERR } = LC;
const $ = id => document.getElementById(id);
const app = $('app');
const EMBED = Q.get('embed') === '1';
if (EMBED) document.body.classList.add('embed');
let toastT = 0;
const toast = t => { $('toast').textContent = t; clearTimeout(toastT); toastT = setTimeout(() => { $('toast').textContent = ''; }, 2600); };
const ago = ms => { const s = Math.round((Date.now() - (ms || Date.now())) / 1000); return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago'; };

const S = { email: '', classes: [], code: '', live: null, ans: [], pulses: [], priv: [], err: '', confirm: '', sort: 'first', curtain: (() => { try { return localStorage.getItem('mtg_live_curtain_v1') === '1'; } catch (e) { return false; } })(), offs: [], offA: null, round: '',
  comp: { type: 'mc', q: '', opts: ['', '', '', ''], correct: '', timer: 0, skills: [], ks: null }, g: null,
  ksm: { open: false, minor: false, style: 'name', clef: 'treble' }, own: false, startOpen: false };
try { S.hideAns = localStorage.getItem('mtg_live_hideans_v1') === '1'; } catch {}   // 2026-11-18: the right answer is marked on the teacher's card unless hidden
// ---------- Game questions (2026-11-17, David 'go'): game + Warm-up / Challenge / Brutal + Go; then Lock, Skip, Next ----------
// The last pick is remembered per class on this computer (localStorage mtg_live_pick_v1:<code>).
const PK = () => 'mtg_live_pick_v1:' + S.code;
const gpick = () => { let o = null; try { o = JSON.parse(localStorage.getItem(PK()) || 'null'); } catch {} return { g: o && qgame(o.g) ? o.g : QGAMES[0].id, d: o && DIFFS[o.d] ? o.d : 'challenge', o: { ...OPT_DEF, ...(o && o.o || {}) }, k: o && o.k || null, t: o && o.t != null ? o.t : null, sn: o && o.sn != null ? o.sn : null, pace: o && o.pace === 'manual' ? 'manual' : 'auto', mixOn: !!(o && o.mixOn), mix: o && Array.isArray(o.mix) ? o.mix.filter(qgame) : [] }; };
// Key signatures tile (2026-11-18): its own picks (p.k = { keys, mode, clef }) instead of a difficulty; they only apply to that tile.
const KDEF = { keys: [], mode: 'major', clef: 'treble', qt: {} };   // qt = question types per tile ({ scale: [...], keysig: [...] }; none = the tile's mix)
const kpick = p => ({ ...KDEF, ...(p.k || {}) });
const gopts = (p, o) => { const G = qgame(p.g); if (!G || !G.pick) return o || p.o; const k = kpick(p); return { ...(o || p.o), keys: k.keys, mode: k.mode, clef: k.clef, qt: (k.qt || {})[p.g] || [] }; };
const kTypes = p => { const G = qgame(p.g), q = (kpick(p).qt || {})[p.g] || []; return q.length ? q : G.qdef; };
const kLabel = p => { const k = kpick(p), n = k.keys.length; return (n ? (n <= 3 ? k.keys.map(x => LC.ksName(+x, k.mode === 'minor').replace(/ (major|minor)$/, '')).join(', ') : n + ' keys') : 'All keys') + ' · ' + ({ major: 'Major', minor: 'Minor', both: 'Major + minor' })[k.mode] + ' · ' + ({ treble: 'Treble', bass: 'Bass', alto: 'Alto', any: 'Mixed clefs' })[k.clef]; };
function kPanel(p) {
  const k = kpick(p), seg = (f, list) => `<span class="seg">${list.map(([v, l]) => `<button type="button" data-act="kset" data-k="${f}" data-v="${v}" aria-pressed="${k[f] === v}">${l}</button>`).join('')}</span>`;
  const nm = n => k.mode === 'minor' ? LC.ksName(n, true).replace(' minor', 'm') : LC.ksName(n, false).replace(' major', '') + (k.mode === 'both' ? ' / ' + LC.ksName(n, true).replace(' minor', 'm') : '');
  return `<div class="stack kpanel" style="gap:8px">
    <div class="row">${seg('mode', [['major', 'Major'], ['minor', 'Minor'], ['both', 'Both']])}${seg('clef', [['treble', '𝄞 Treble'], ['bass', '𝄢 Bass'], ['alto', '𝄡 Alto'], ['any', 'Mix']])}<span class="grow"></span><span class="dim small">${k.keys.length ? k.keys.length + ' keys picked' : 'No keys picked = all 15'}</span>${k.keys.length ? '<button class="btn sm" type="button" data-act="kclear">✕ Clear</button>' : ''}</div>
    <div class="chipset kqt" role="group" aria-label="Question types">${LC.KQ.map(([v, l]) => `<button type="button" data-act="kqt" data-v="${v}" aria-pressed="${kTypes(p).includes(v)}">${l}</button>`).join('')}</div>
    <div class="kskeys">${KS_ORDER.map(n => `<button class="btn" type="button" data-act="kkey" data-v="${n}" aria-pressed="${k.keys.map(Number).includes(n)}" title="${n ? Math.abs(n) + (n > 0 ? ' sharp' : ' flat') + (Math.abs(n) > 1 ? 's' : '') : 'No sharps or flats'}">${esc(nm(n))} <small>${n ? Math.abs(n) + (n > 0 ? '♯' : '♭') : '0'}</small></button>`).join('')}</div></div>`;
}
const savePick = p => { try { localStorage.setItem(PK(), JSON.stringify(p)); } catch {} };
const GQ_TIMER = 30;   // seconds for a game question unless Customize changes it (Showdown keeps its own 20 s)
// Customize (step 3): a drawer under Go. The choices change a draft (S.cust); the sample question redraws on every tap; Use these saves it.
const custLabel = (G, o) => { const parts = Object.entries(G.opts).filter(([k]) => Array.isArray(o[k]) ? o[k].length : o[k] && o[k] !== OPT_DEF[k])
    .map(([k, l]) => Array.isArray(o[k]) ? (o[k].length === 1 ? (l.find(x => String(x[0]) === String(o[k][0])) || [, ''])[1] + ' only' : o[k].length + ' ' + (k === 'ivs' ? 'intervals' : 'chords')) : (l.find(x => String(x[0]) === String(o[k])) || [, ''])[1]);
  return parts.join(' · '); };
// the timer for game questions sits on the Start card (David 2026-11-18: not hidden in Customize); p.t, the same for every game
const gtimer = p => p.t != null ? +p.t : p.o.timer != null ? +p.o.timer : GQ_TIMER;
const timerSeg = p => `<span class="row" style="gap:6px;margin-left:auto"><span class="label">⏱ Timer</span><span class="seg">${[[15, '15 s'], [20, '20 s'], [30, '30 s'], [0, 'Off']].map(([v, l]) => `<button type="button" data-act="gtime" data-v="${v}" aria-pressed="${gtimer(p) === v}" title="${v ? 'Answers lock after ' + v + ' seconds' : G().on ? 'Showdown still uses ' + GT + ' seconds' : 'No timer: you lock it'}">${l}</button>`).join('')}</span></span>`;
function custDrawer() {
  const p = gpick(), G = qgame(p.g), o = S.cust.o, multi = G.multi || [], seg = (k, list) => { const m = multi.includes(k), cur = Array.isArray(o[k]) ? o[k].map(String) : [];
    return `<div class="crow"><span class="label">${{ type: 'Question type', play: 'Play as', clef: 'Clef', acc: 'Keys', mode: 'Major or minor', ivs: 'Intervals', chords: 'Chords', inv: 'Inversions', root: 'Starting note', range: 'Range', timer: 'Timer' }[k]}${m ? ' <span class="dim" style="text-transform:none;letter-spacing:0;font-weight:500">(tap any number; none = the difficulty decides; one = always that one)</span>' : ''}</span><span class="chipset">${list.map(([v, l]) => `<button type="button" data-act="cset" data-k="${k}" data-v="${v}"${m ? ' data-multi="1"' : ''} aria-pressed="${m ? cur.includes(String(v)) : String(o[k]) === String(v)}">${l}</button>`).join('')}${m && cur.length ? `<button type="button" data-act="cclear" data-k="${k}">✕ Clear</button>` : ''}</span></div>`; };
  if (!S.cust.sample) S.cust.sample = makeQ(p.g, p.d, gopts(p, o));
  const q = S.cust.sample;
  return `<div class="cust stack">
    <div class="sample"><span class="label">Sample${G.pick ? '' : ' · ' + esc(DIFFS[p.d])}</span><b>${esc(q.q)}</b>${LC.staffFor(q, 'teach')}<div class="row">${q.opts.map(x => `<span class="chip ${x === q.correct ? 'ok' : ''}">${x === q.correct ? '✓ ' : ''}${esc(x)}</span>`).join('')}</div>
      <button class="btn sm" type="button" data-act="csample" style="align-self:flex-start">↻ Another sample</button></div>
    ${Object.entries(G.opts).map(([k, l]) => seg(k, l)).join('')}
    <div class="row"><button class="btn pri" type="button" data-act="cuse">Use these</button><button class="btn" type="button" data-act="creset">Back to normal</button><button class="btn" type="button" data-act="cclose">Cancel</button></div></div>`;
}
function startCard() {
  const p = gpick(), G = qgame(p.g);
  return `<section class="card stack startq" aria-label="Start a question">

const TK = () => 'mtg_live_teach_v1:' + S.code;    // the correct answer stays on this computer (the projector reads it)

// ---------- Showdown (game mode, 2026-11-17, David 'go with your picks'; our own music look, not any quiz app's): right AND fast answers score; top 5 on the screen; Curtain call at the end ----------
// Scores live on this computer (localStorage mtg_live_game_v1:<code>); the class sees only the top-5 board and, after time is up, the right choice.
const GK = () => 'mtg_live_game_v1:' + S.code;
const G = () => { if (!S.g || S.g.code !== S.code) { let o = null; try { o = JSON.parse(localStorage.getItem(GK()) || 'null'); } catch {} S.g = o && o.scores ? { ...o, code: S.code } : { code: S.code, on: false, scores: {}, qn: 0, starts: {}, done: {} }; } return S.g; };
const saveG = () => { try { localStorage.setItem(GK(), JSON.stringify(S.g)); } catch {} };
const GT = 20;   // seconds per game question unless a timer is picked
// with 🎭 Hide names on, the class screen's Top 5 and Curtain call say Player 1, 2… instead of names (2026-11-17)
// g = points won this round, m = places moved since the last round (+ up, - down; missing for a new name) (2026-11-17)
function topBoard() { const pr = G().prev || {}; return Object.entries(G().scores).map(([s, x]) => ({ n: x.n, s, p: x.p, g: x.g || 0 })).sort((a, b) => b.p - a.p).map((b, i) => pr[b.s] != null ? { ...b, m: pr[b.s] - i } : b).slice(0, 5).map((b, i) => S.curtain ? { ...b, n: 'Player ' + (i + 1), h: 1 } : b); }   // h = hide the avatar too (it is recognisable)
// score the round from each student's FIRST answer: right = 500 + up to 500 for speed, +100 per right answer in a row after the 2nd
function scoreRound(L) {
  const g = G(); if (g.done[L.round]) return;
  const c = correct(), start = g.starts[L.round] || 0, dur = L.ends_at && start ? Math.max(5000, L.ends_at - start) : GT * 1000;
  const first = {}; S.ans.slice().sort((a, b) => (a.at || 0) - (b.at || 0)).forEach(a => { if (!first[a.sid]) first[a.sid] = a; });
  const seen = new Set(Object.keys(first));
  g.prev = {}; Object.entries(g.scores).sort((a, b) => b[1].p - a[1].p).forEach(([sid], i) => { g.prev[sid] = i; });   // places before this round
  Object.values(g.scores).forEach(x => { x.g = 0; });
  Object.values(first).forEach(a => {
    const x = g.scores[a.sid] || (g.scores[a.sid] = { n: a.name, p: 0, st: 0 }); x.n = a.name;
    const ok = c && a.text === c, secs = start ? Math.max(0, ((a.at || start) - start) / 1000) : dur / 2000;
    x.a = (x.a || 0) + 1; if (ok) { x.r = (x.r || 0) + 1; x.st++; x.g = 500 + Math.round(500 * Math.max(0, 1 - secs / (dur / 1000))) + (x.st > 2 ? 100 : 0); x.p += x.g; } else x.st = 0;

}

});
app.addEventListener('change', e => {
  const id = e.target.id, c = S.comp, v = e.target.value;
  if (id === 'cls') { const u = new URL(location.href); u.searchParams.set('code', v); history.replaceState(null, '', u); openClass(v); return; }
  if (id === 'sort') { S.sort = v; draw(); return; }

  if (id === 'c-type') { c.type = v; c.correct = ''; if (v !== 'mc') c.ks = null; draw(); return; }
  if (id === 'c-timer') { c.timer = Number(v) || 0; return; }
  if (id === 'c-correct') { c.correct = v; return; }
  if (/^c-o\d$/.test(id)) { draw(); return; }   // refresh the correct-answer list
  if (id === 'bank' && v !== '') { const b = BANK[+v]; S.comp = { type: b.type, q: b.q, opts: b.opts ? b.opts.slice() : ['', '', '', ''], correct: b.correct || '', timer: c.timer, skills: (b.skills || []).slice() }; draw(); }
});
// Students expire from the roster even if nothing new arrives from Firestore.
setInterval(() => { const roster = $('live-roster'); if (roster) roster.innerHTML = rosterHtml(); }, 15000);
// the timer: count down, and lock the answers when it runs out (this page does it, so keep it open during class)
setInterval(() => {
  if (LC.isLobby(S.live) && Date.now() - (S.whoAt || 0) > 2000) {
    S.whoAt = Date.now();
    const who = lobbyStudents(S.live), count = $('showdown-count'), roster = $('showdown-roster');
    if (count) count.textContent = who.length + ' joined';
    if (roster) roster.innerHTML = lobbyNames(who);
    const w = whoList(who), key = JSON.stringify(w);
    if (key !== S.whoKey) { S.whoKey = key; upd({ show: { ...S.live.show, who: w } }); }
  }
  const L = S.live; if (!L || !L.q || !L.ends_at) return;
  const s = left(L), el = $('cd'); if (el) el.textContent = clock(s);
  if (s === 0 && L.open && start.locking !== L.round) { start.locking = L.round; if (L.game) gameLock(L); else upd({ open: false, reveal: revealIdx(L) }); }
}, 500);
start();
})();
</script>
