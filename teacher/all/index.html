<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Games Dashboard · Music Theory Games</title>
<meta name="description" content="Teachers: see every game and every student's scores in one place.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Josefin+Sans:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Look (skin), shared by every Music Theory Game: clean (default), day or classic. */
(function () {
  var ok = ['clean', 'day', 'classic'], s = null;
  try { var q = new URLSearchParams(location.search).get('skin'); if (ok.indexOf(q) >= 0) { s = q; localStorage.setItem('mtg_skin_v1', q); } } catch (e) {}
  if (!s) try { s = localStorage.getItem('mtg_skin_v1'); } catch (e) {}
  document.documentElement.dataset.skin = ok.indexOf(s) >= 0 ? s : 'clean';
})();
</script>
<style>
  :root {
    --bg: #0d1420; --bg-glow: #1b2a44; --card: #141d2c; --card-border: #26344b;
    --text: #f1ece0; --muted: #9aa7bb; --gold: #ffc85c; --btn: #ffc85c; --btn-ink: #10131a;
    --err: #ff8a7a; --ok: #7dd3a8;
    --f-ui: "Josefin Sans", system-ui, sans-serif; --f-display: "Abril Fatface", Georgia, serif;
    --gc: #ffc85c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: radial-gradient(1200px 700px at 50% -10%, var(--bg-glow), var(--bg) 70%) fixed, var(--bg); color: var(--text); font-family: var(--f-ui); padding: 0 16px 48px; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .back { display: inline-block; margin-top: 18px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 15px; padding: 6px 0; }
  .back:hover { color: var(--text); }
  header { padding: 14px 0 18px; }
  .eyebrow { color: var(--gold); letter-spacing: .25em; font-size: 13px; font-weight: 700; text-transform: uppercase; margin: 0 0 8px; }
  h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 6vw, 50px); line-height: 1.05; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 18px 20px; margin-bottom: 20px; }
  .card p { margin: 0 0 10px; color: var(--muted); }
  .who { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .who b { color: var(--text); }
  .btn { font: 700 14px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 12px 20px 9px; cursor: pointer; border: 1px solid var(--btn); background: var(--btn); color: var(--btn-ink); }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--card-border); }
  .btn.sm { padding: 7px 14px 5px; font-size: 13px; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .msg { min-height: 1.3em; margin: 10px 0 0; color: var(--err); font-weight: 600; }
  .msg.ok { color: var(--ok); }

  /* game tabs, each in its game's color */
  .games { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 16px; padding: 0; list-style: none; }
  .gt { font: 700 16px var(--f-ui); color: var(--text); background: var(--card); border: 2px solid var(--gc); border-radius: 14px; padding: 12px 18px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; }
  .gt i { width: 12px; height: 12px; border-radius: 50%; background: var(--gc); flex: none; }
  .gt:hover { filter: brightness(1.12); }
  .gt[aria-pressed="true"] { background: var(--gc); color: #10131a; }
  .gt[aria-pressed="true"] i { background: #10131a; }
  .gt:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  /* options */
  .opts { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
  label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); min-width: 0; }
  select { font: 600 16px var(--f-ui); color: var(--text); background: var(--bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px 8px; min-width: 190px; letter-spacing: 0; text-transform: none; }
  select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .seg { display: inline-flex; border: 1px solid var(--card-border); border-radius: 999px; overflow: hidden; }
  .seg button { font: 700 14px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; background: var(--bg); color: var(--muted); border: 0; padding: 11px 18px 9px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--gc); color: #10131a; }
  /* Admin tab pulses (admin only) while teacher requests are waiting */
  .seg button.waiting { position: relative; color: #10131a; background: #ffb547; animation: adminpulse 1.4s ease-in-out infinite; }
  .seg button.waiting .rq { display: inline-block; min-width: 18px; margin-left: 6px; padding: 1px 5px 0; border-radius: 999px; background: #c0392b; color: #fff; font-size: 12px; letter-spacing: 0; }
  .newsbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 8px 0 4px; padding: 10px 14px; border: 2px solid #ffb547; border-radius: 12px; font-weight: 700; }
  @keyframes adminpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,181,71,.75); } 50% { box-shadow: 0 0 0 8px rgba(255,181,71,0); filter: brightness(1.15); } }
  @media (prefers-reduced-motion: reduce) { .seg button.waiting { animation: none; } }
  .access { margin-top: 16px; display: grid; gap: 14px; }
  .access h3 { font: 700 15px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 6px; }
  .access .req { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border: 2px solid #ffb547; border-radius: 12px; }
  .access .req .who { flex: 1 1 260px; }
  .access .req .who small, .access .tlist small { color: var(--muted); }
  .access form { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: end; }
  .access form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .access form input { font: 600 15px var(--f-ui); padding: 9px 10px; border-radius: 10px; border: 1px solid var(--card-border); background: var(--bg); color: var(--text); min-width: 0; }
  .access .tlist { display: grid; gap: 6px; }
  .access .tlist div { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--card-border); }
  .xseg .segl { font: 700 14px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; background: var(--bg); color: var(--gold); text-decoration: none; padding: 11px 18px 9px; border-left: 1px solid var(--card-border); }
  .seg .segl:hover { color: var(--text); }
  .seg .segl:focus-visible { outline: 2px solid var(--text); outline-offset: -3px; }
  .seg button:focus-visible { outline: 2px solid var(--text); outline-offset: -3px; }
  .grow { flex: 1; }

  /* table */
  .tw { overflow-x: auto; margin-top: 14px; border: 1px solid var(--card-border); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; }
  th, td { text-align: left; padding: 10px 14px 8px; white-space: nowrap; }
  td { border-top: 1px solid var(--card-border); }
  th { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--bg); padding: 0; }
  th button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; cursor: pointer; width: 100%; text-align: left; padding: 11px 14px 9px; display: inline-flex; gap: 6px; align-items: center; }
  th button:hover { color: var(--text); }
  th button:focus-visible { outline: 2px solid var(--text); outline-offset: -3px; }
  th[aria-sort="ascending"] button, th[aria-sort="descending"] button { color: var(--gc); }
  th .ar { font-size: 10px; width: 10px; display: inline-block; }
  th.num button, td.num { justify-content: flex-end; text-align: right; }
  th.num { text-align: right; }
  tbody tr:hover td { background: color-mix(in srgb, var(--gc) 8%, transparent); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .low { color: var(--err); font-weight: 700; }
  .good { color: var(--ok); font-weight: 700; }
  .empty { padding: 26px 14px; text-align: center; color: var(--muted); }
  table.plain th { padding: 11px 14px 9px; }
  .devtag { font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 2px 6px; margin-left: 6px; border-radius: 6px; background: #ff5fd2; color: #120b1f; vertical-align: middle; }
  .tlink { font: inherit; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .tlink b { text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 3px; }
  .tlink:hover b, .tlink:focus-visible b { text-decoration-color: currentColor; }
  tr.trow { cursor: pointer; } tr.trow:hover td { background: color-mix(in srgb, var(--text) 5%, transparent); }
  .tp h3 { font: 700 15px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 0; }
  .tp .tpwho { display: flex; justify-content: flex-start; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-top: 12px; }
  .tp .tpwho h2 { margin: 0; font-size: 26px; }
  .tp .tpwho span { color: var(--muted); }
  .tp .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
  .tp .tile { border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 14px; }
  .tp .tile small { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tp .tile b { font-size: 22px; }
  .tp .st { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--text) 10%, transparent); }
  .tp .st.on { background: color-mix(in srgb, #5fe3a4 25%, transparent); color: #5fe3a4; }
  .tp td.wrap { white-space: normal; min-width: 220px; }
  .up { margin: 16px 0 6px; }
  .up h3 { font: 700 12px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .up ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .up li button { width: 100%; text-align: left; display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; background: var(--bg); color: var(--ink, inherit); border: 1px solid var(--line, rgba(255,255,255,.12)); border-left: 4px solid var(--ic, var(--gc)); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 15px; cursor: pointer; }
  .up li button:hover, .up li button:focus-visible { border-color: var(--ic, var(--gc)); }
  .up .w { font-weight: 700; min-width: 190px; }
  .up .k { font: 700 11px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: 8px; }
  .up .s { color: var(--muted); font-size: 13px; margin-left: auto; }
  .note { font-size: 15px; color: var(--muted); margin: 12px 0 0; }
  .fbtext { white-space: normal; min-width: 260px; max-width: 520px; }
  .x { font: 700 14px var(--f-ui); border: 1px solid var(--card-border); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 11px 2px; cursor: pointer; }
  .x:hover { color: var(--err); border-color: var(--err); }
  .count { color: var(--muted); font-size: 15px; margin: 14px 0 0; }
  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 28px; }
  .pv { background: var(--gold); color: #10131a; font-weight: 700; text-align: center; padding: 6px; font-size: 14px; border-radius: 10px; margin: 12px 0 0; }

  /* ---------- Messages and Teacher Board (added 2026-10-18) ---------- */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .seg button .nb, .mx-item .rq { display: inline-block; min-width: 18px; margin-left: 6px; padding: 1px 5px 0; border-radius: 999px; font-size: 12px; letter-spacing: 0; text-align: center; }
  .seg button .nb { background: var(--gold); color: #10131a; }
  .mx-item .rq { background: #c0392b; color: #fff; margin-left: 0; }
  .mx { display: grid; grid-template-columns: minmax(230px, 300px) 1fr; gap: 14px; margin-top: 14px; height: clamp(420px, calc(100vh - 240px), 680px); }
  .mx.solo { grid-template-columns: 1fr; }
  .mx-list, .mx-thread { display: flex; flex-direction: column; min-height: 0; min-width: 0; border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; }
  .mx-top, .mx-head { display: flex; align-items: center; gap: 8px 10px; padding: 10px 12px; border-bottom: 1px solid var(--card-border); background: var(--bg); }
  .mx-top { justify-content: space-between; }
  .mx-top h3, .mx-head h3 { margin: 0; font: 700 16px var(--f-ui); }
  .mx-head h3:focus { outline: none; }
  .mx-head small { color: var(--muted); font-size: 13px; }
  .mx-list ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .mx-item { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--card-border); color: var(--text); font: inherit; font-size: 15px; padding: 10px 12px; cursor: pointer; }
  .mx-item:hover { background: color-mix(in srgb, var(--gold) 7%, transparent); }
  .mx-item.on { background: color-mix(in srgb, var(--gold) 15%, transparent); box-shadow: inset 3px 0 0 var(--gold); }
  .mx-item:focus-visible { outline: 2px solid var(--text); outline-offset: -3px; }
  .mx-n { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .mx-n b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mx-s, .mx-p { grid-column: 1 / -1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mx-item.unread .mx-p { color: var(--text); font-weight: 600; }
  .mx-item time { grid-row: 1; grid-column: 2; font-size: 12px; color: var(--muted); }
  .mx-empty { align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); }
  .mx-back { display: none; white-space: nowrap; flex: none; }
  .mx-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .mx-log:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; }
  .mx-older { align-self: center; }
  .card .mx-none { margin: auto; color: var(--muted); text-align: center; max-width: 360px; }
  .bub { max-width: min(78%, 560px); padding: 9px 13px 6px; border-radius: 16px 16px 16px 4px; border: 1px solid var(--card-border); background: var(--bg); align-self: flex-start; }
  .bub.me { align-self: flex-end; border-radius: 16px 16px 4px 16px; background: color-mix(in srgb, var(--gold) 20%, var(--card)); border-color: color-mix(in srgb, var(--gold) 45%, var(--card-border)); }
  .card .bub p { margin: 0; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
  .bt { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 3px; font-size: 12px; color: var(--muted); }
  .bx { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 0 2px; }
  .bx:hover, .bx:focus-visible { color: var(--err); }
  .reply { border-top: 1px solid var(--card-border); padding: 10px 12px; background: var(--bg); }
  .reply textarea, .bd-new textarea { display: block; width: 100%; resize: vertical; min-height: 48px; max-height: 240px; font: 500 16px/1.4 var(--f-ui); color: var(--text); background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: 9px 11px; }
  .reply textarea:focus, .bd-new textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .reply-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 12px; margin-top: 8px; }
  .reply-bar .hint { margin-right: auto; color: var(--muted); font-size: 12.5px; }
  .ck { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .ck input { width: 17px; height: 17px; accent-color: #ffb547; }
  .bd { margin-top: 14px; display: grid; gap: 14px; }
  .bd-new { border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; background: var(--bg); }
  .bd-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .post { border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 14px 8px; background: var(--card); }
  .post.pin { border-color: color-mix(in srgb, var(--gold) 60%, var(--card-border)); }
  .post.ann { border: 2px solid #ffb547; background: color-mix(in srgb, #ffb547 9%, var(--card)); }
  .annl { font: 700 12px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .ph { font-size: 13.5px; color: var(--muted); } .ph b { color: var(--text); }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px 0; border-radius: 999px; border: 1px solid var(--card-border); color: var(--muted); margin-left: 4px; }
  .chip.new { background: var(--gold); color: #10131a; border-color: var(--gold); }
  .card .ptext { margin: 6px 0 6px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
  .pa { display: flex; flex-wrap: wrap; gap: 2px 18px; }
  .lnk { background: none; border: 0; padding: 6px 0; font: 700 14px var(--f-ui); color: var(--gold); cursor: pointer; }
  .lnk.del { color: var(--muted); } .lnk.del:hover { color: var(--err); }
  .lnk:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
  .replies { margin: 6px 0 6px; border-left: 3px solid var(--card-border); padding-left: 12px; }
  .replies ul { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 10px; }
  .card .rp p { margin: 2px 0 0; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
  .replies .reply { border: 1px solid var(--card-border); border-radius: 10px; }
  .bd-more { justify-self: center; }
  @media (max-width: 720px) {
    #views { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 14px; background: var(--bg); width: 100%; }
    #views button { padding: 11px 6px 9px; white-space: nowrap; }
    .mx { grid-template-columns: 1fr; height: auto; }
    .mx.show-thread .mx-list, .mx:not(.show-thread) .mx-thread { display: none; }
    .mx-list ul { max-height: 70vh; }
    .mx-thread { height: calc(100vh - 120px); min-height: 420px; }
    .mx-back { display: inline-block; }
    .bub { max-width: 88%; }
    .post { padding: 10px 12px 6px; }
  }

  html:not([data-skin="classic"]) {
    --bg: #0f1a2b; --bg-glow: #0f1a2b; --card: #16233a; --card-border: #263a56;
    --text: #eef2f7; --muted: #a3b2c6; --gold: #ffcc66; --btn: #ffcc66; --btn-ink: #10131a; --err: #ff8a7a;
    --f-ui: "Outfit", ui-sans-serif, system-ui, sans-serif; --f-display: "Outfit", ui-sans-serif, system-ui, sans-serif;
  }
  html[data-skin="day"] {
    color-scheme: light;
    --bg: #f3f6fb; --bg-glow: #f3f6fb; --card: #ffffff; --card-border: #d8e0eb;
    --text: #17233a; --muted: #52627a; --gold: #9a5b00; --btn: #ffc24d; --btn-ink: #17130a; --err: #c2410c; --ok: #15803d;
  }
  html:not([data-skin="day"]) { color-scheme: dark; }
  html:not([data-skin="classic"]) h1 { font-weight: 800; letter-spacing: -.02em; }
  html[data-skin="day"] .card { box-shadow: 0 6px 18px -14px rgba(23, 35, 58, .35); }
  html[data-skin="day"] th[aria-sort] button { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../">← Music Theory Games</a>
  <header>
    <p class="eyebrow">For teachers</p>
    <h1>All games dashboard</h1>
  </header>

  <section class="card" id="gate" aria-live="polite"><p>Loading…</p></section>

  <div id="main" hidden>
    <div class="who"><span id="who"></span><button class="btn ghost sm" type="button" id="signout">Sign out</button></div>

    <ul class="games" id="games" aria-label="Games"></ul>

    <section class="card" id="panel">
      <div class="opts">
        <label class="f" for="cls">Class<select id="cls"></select></label>
        <label class="f" for="rng">Time<select id="rng">
          <option value="1">Today</option>
          <option value="7" selected>Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="0">All time</option>
        </select></label>
        <div class="seg" id="views" role="group" aria-label="What to show">
          <button type="button" data-v="progress" aria-pressed="true">Progress</button>
          <button type="button" data-v="scores" aria-pressed="false">Scores</button>
          <button type="button" data-v="grades" aria-pressed="false">Grades</button>
          <button type="button" data-v="assign" aria-pressed="false">Assign</button>
          <button type="button" data-v="tests" aria-pressed="false">Tests</button>
          <button type="button" data-v="feedback" aria-pressed="false">Feedback</button>

// ---------- Firebase ----------
let fbP = null, fbAuthP = null;

  if (e && e.message === 'timeout') return 'The database took too long to answer. Check your internet connection.';
  if (c === 'unavailable' || (e && /fetch|network|load/i.test(e.message || ''))) return "Couldn't reach the database. Check your internet connection and try again.";

}
function msg(text, ok) { const e = $('msg'); e.textContent = text || ''; e.className = 'msg' + (ok ? ' ok' : ''); }

// ---------- dates (this computer decides what "today" is) ----------
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function lastDays(n) { const out = []; const d = new Date(); for (let i = 0; i < n; i++) { out.push(ymd(d)); d.setDate(d.getDate() - 1); } return out; }
function toMs(v) {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return v;
  if (typeof v.toMillis === 'function') return v.toMillis();
  if (typeof v.seconds === 'number') return v.seconds * 1000;
  const t = Date.parse(v); return isNaN(t) ? 0 : t;
}
function fmtDate(ms) {
  if (!ms) return '';
  const d = new Date(ms); const now = new Date();
  const day = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
  return day + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function fmtDay(s) { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ''); if (!m) return s || ''; return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const pct = (a, b) => (b > 0 ? Math.round(100 * a / b) : null);

// ---------- loading data ----------
function normProgress(gid, d) {
  const g = G[gid]; const attempts = num(d[g.attempts]); const correct = num(d.correct);
  return {
    raw: d, game: gid, name: d.student || 'Student', date: d.date || '', dateMs: toMs(d.last_at) || toMs(d.updated_at) || Date.parse((d.date || '') + 'T12:00:00') || 0,
    attempts, correct, acc: pct(correct, attempts), minutes: Math.round(num(d.minutes) * 10) / 10,
  };
}
function normScore(gid, d, col) {
  const o = { game: gid, col: col || G[gid].scores, dev: !!d.dev, name: d.name || 'Student', dateMs: toMs(d.created_at), score: num(d.score), acc: null, detail: '' };
  if (gid === 'rhythm') { o.acc = pct(num(d.correct), num(d.total)); o.detail = d.level ? 'Level ' + d.level : ''; }
  else if (gid === 'scale') { const a = num(d.accuracy); o.acc = a ? Math.round(a <= 1 ? a * 100 : a) : null; o.detail = d.questions ? d.questions + ' questions' : ''; }
  else if (gid === 'earshot') { const a = num(d.acc); o.acc = a ? Math.round(a <= 1 ? a * 100 : a) : null; o.detail = d.town ? String(d.town) : ''; }
  else if (gid === 'brainwaves') { o.acc = d.acc == null ? null : Math.round(num(d.acc)); o.detail = (BW_COL[col] || '') + (d.floor || d.level ? ' · Level ' + (d.floor || d.level) : ''); }
  else { const a = num(d.acc); o.acc = a ? Math.round(a <= 1 ? a * 100 : a) : null; o.detail = d.level ? 'Level ' + d.level : ''; }
  return o;
}
// ---------- Grades: how far each student got on the class's assignment (for the grade book) ----------
// A class keeps one assignment (classes/<code>.hub_assignment: start, end, up to 3 tasks). Each task counts the student's
// practice records in that game from start to end: answers (or minutes); Scale Quest counts only the assigned keys.
// Grade = the average of the tasks, each capped at 100%. Earshot Saloon and Brainwaves keep no practice records yet.
const dayList = (a, b) => { const out = []; for (let d = new Date(a + 'T12:00:00'); ymd(d) <= b && out.length < 120; d.setDate(d.getDate() + 1)) out.push(ymd(d)); return out; };
const taskName = t => { const g = G[t.game], keys = t.game === 'scale' && t.settings && Array.isArray(t.settings.keys) ? t.settings.keys : [], sk = [].concat(t.skills || t.skill || []).filter(Boolean);
  return `${g ? g.name : 'Any game'}${keys.length ? ': ' + keys.join(', ') : sk.length ? ': ' + sk.join(', ') : ''}`; };
function taskCount(t, recs) {   // recs: one student's practice records in the date range
  const mine = recs.filter(r => t.game === 'any' || r.game === t.game);
  if (t.unit === 'minutes') return { done: Math.round(mine.reduce((a, r) => a + r.minutes, 0)), right: null, all: null };
  const keys = t.game === 'scale' && t.settings && Array.isArray(t.settings.keys) && t.settings.keys.length ? t.settings.keys : null;
  let done = 0, right = 0;
  mine.forEach(r => { if (keys && r.raw && r.raw.by_key) keys.forEach(k => { const v = r.raw.by_key[k]; if (v) { right += num(v[0]); done += num(v[1]); } }); else if (!keys) { done += r.attempts; right += r.correct; } });
  return { done, right, all: done };
}
async function loadGrades() {
  const c = S.classes.find(x => x.code === S.code), a = PREVIEW ? { start: ymd(new Date(Date.now() - 2 * 864e5)), end: ymd(new Date()), tasks: [{ game: 'scale', goal: 40, unit: 'answers', settings: { keys: ['F', 'Bb', 'Eb', 'Ab'] } }, { game: 'tidal', goal: 15, unit: 'minutes' }] } : c && c.hub_assignment;
  S.gradeA = a && Array.isArray(a.tasks) && a.tasks.length ? a : null;
  COLS.grades = [{ k: 'name', h: 'Student', t: 's' }].concat((S.gradeA ? S.gradeA.tasks : []).map((t, i) => ({ k: 't' + i, h: `${taskName(t)} (goal ${t.goal} ${t.unit === 'minutes' ? 'min' : 'answers'})`, t: 'n', num: 1, f: r => `${r['t' + i] >= t.goal ? '✓ ' : ''}${fmtN(r['t' + i])} / ${t.goal}` })),
    [{ k: 'acc', h: 'Accuracy', t: 'n', num: 1, f: r => accCell(r.acc) }, { k: 'grade', h: 'Grade', t: 'n', num: 1, f: r => `<b>${r.grade}%</b>` }, { k: 'status', h: 'Status', t: 's', f: r => r.grade >= 100 ? '<b style="color:#2fbf71">✓ Done</b>' : r.status }, { k: 'dateMs', h: 'Last practiced', t: 'n', f: r => esc(fmtDate(r.dateMs)) }]);
  if (!S.gradeA) return [];
  const games = [...new Set(S.gradeA.tasks.flatMap(t => t.game === 'any' ? GAMES.slice(1).filter(g => g.prog).map(g => g.id) : [t.game]))].filter(id => G[id] && G[id].prog);
  const ds = dayList(S.gradeA.start, S.gradeA.end);
  let recs = [];
  if (PREVIEW) { SAMPLE = SAMPLE || sample(); recs = SAMPLE.prog.filter(r => games.includes(r.game)).map(r => r.game === 'scale' ? { ...r, raw: { by_key: { F: [Math.round(r.correct / 3), Math.round(r.attempts / 3)], Bb: [Math.round(r.correct / 4), Math.round(r.attempts / 4)], C: [5, 6] } } } : r); }
  else recs = (await run(async ({ fs, db }) => {
    const out = [], owner = (c && c.ownerEmail) || S.email;
    for (const gid of games) for (let i = 0; i < ds.length; i += 30) {
      (await fs.getDocs(fs.query(fs.collection(db, G[gid].prog), fs.where('owner', '==', owner), fs.where('class_code', '==', S.code), fs.where('date', 'in', ds.slice(i, i + 30))))).forEach(x => out.push({ ...normProgress(gid, x.data()), sid: x.data().sid || x.data().student }));
    }
    return out;
  }));
  const by = {}; recs.forEach(r => { const k = String(r.sid || r.name).toLowerCase(); (by[k] = by[k] || []).push(r); });
  return Object.values(by).map(list => {
    const row = { game: 'all', name: list[0].name, dateMs: Math.max(...list.map(r => r.dateMs || 0)) }; let right = 0, all = 0;
    const parts = S.gradeA.tasks.map((t, i) => { const n = taskCount(t, list); row['t' + i] = n.done; if (n.all) { right += n.right; all += n.all; } return Math.min(1, n.done / Math.max(1, t.goal)); });

const fmtN = n => Number(n || 0).toLocaleString();
function days() { const n = +$('rng').value; return n ? lastDays(n) : null; }
async function fetchProgress(gid) {
  const g = G[gid]; if (!g.prog) return [];
  const ds = days();
  return run(async ({ fs, db }) => {
    const col = fs.collection(db, g.prog); const out = [];
    if (!ds) { (await fs.getDocs(fs.query(col, fs.where('class_code', '==', S.code)))).forEach(x => out.push(normProgress(gid, x.data()))); return out; }

async function fetchScores(gid) {
  const g = G[gid];
  if (S.code === WORLD) return run(async ({ fs, db }) => {
    const out = [];
    for (const col of [].concat(g.scores)) (await fs.getDocs(fs.query(fs.collection(db, col), fs.orderBy('score', 'desc'), fs.limit(50)))).forEach(x => {
      const d = x.data(), r = normScore(gid, d, col); r.id = x.id; r.detail = [r.detail, d.class_code ? 'Class ' + d.class_code : 'No class'].filter(Boolean).join(' · '); out.push(r);

  return run(async ({ fs, db }) => {
    const out = [];
    for (const col of [].concat(g.scores)) (await fs.getDocs(fs.query(fs.collection(db, col), fs.where('class_code', '==', S.code)))).forEach(x => out.push({ ...normScore(gid, x.data(), col), id: x.id }));

    const snap = await fs.getDocs(fs.query(fs.collection(db, 'game_feedback'), fs.where('owner', '==', S.email)));

// ---------- sample data for ?preview=1 ----------
function sample() {
  const names = ['Aaliyah R.', 'Marcus T.', 'Sofia L.', 'Jamal W.', 'Emma K.', 'Diego P.', 'Priya S.', 'Noah B.'];

  const ds = lastDays(7);

      }

    names.forEach(n => {

      const d = ds[Math.floor(rnd() * 7)];
      scores.push({ id: 'pv' + scores.length, game: gid, name: n, dateMs: Date.parse(d + 'T' + pad(8 + Math.floor(rnd() * 7)) + ':' + pad(Math.floor(rnd() * 60)) + ':00'), score: Math.round(200 + rnd() * 2800), acc: 55 + Math.floor(rnd() * 45), detail: gid === 'scale' ? Math.round(10 + rnd() * 20) + ' questions' : gid === 'earshot' ? 'Dry Gulch' : gid === 'brainwaves' ? 'Sharp or Flat? · Level ' + (1 + Math.floor(rnd() * 5)) : 'Level ' + (1 + Math.floor(rnd() * 5)) });
    });
  });
  const T = ['Loved the new level!', 'The piano sound is too quiet on my Chromebook.', 'Can we play Rooftop Runner in class tomorrow?', 'Scale Quest is hard but fun.'];
  T.forEach((t, i) => fbs.push({ id: 'f' + i, game: ['tidal', 'rooftop', 'rooftop', 'scale'][i], name: names[i], code: 'PREVW', text: t, dateMs: Date.now() - i * 86400000 * 1.3 }));

const seenKey = () => 'mtg_board_seen_v1:' + S.email;
function boardSeen() { try { const v = +localStorage.getItem(seenKey()); if (v) return v; } catch (e) {} return Date.now() - 7 * 86400000; }   // first visit: the last week counts as new
function markBoardSeen() { try { localStorage.setItem(seenKey(), String(Date.now())); } catch (e) {} }
const isNewPost = (p, seen) => toMs(p.last_at) > seen && !(p.author_email === S.email && !p.reply_count);
function sortPosts(list) {
  const by = new Map(); list.forEach(p => by.set(p.id, p));
  return [...by.values()].sort((a, b) => (b.pinned - a.pinned) || (toMs(b.last_at) - toMs(a.last_at)));
}
async function loadBoardFirst() {
  const bd = S.bd, [pins, page] = await Promise.all([API.pinned(), API.posts(null)]);
  bd.posts = sortPosts([...pins, ...page.list]); bd.cursor = page.cursor; bd.more = page.more; bd.loadedAt = Date.now();
  bd.replies = {}; bd.open = new Set([...bd.open].filter(id => bd.posts.some(p => p.id === id)));
}
async function checkBoard() {

}
async function openBoard() {

async function addPost(form) {

async function boardClick(e) {
  const bd = S.bd, t = e.target.closest('button'); if (!t) return;
  try {
    if (t.dataset.exp) {
      const id = t.dataset.exp; if (bd.open.has(id)) bd.open.delete(id); else bd.open.add(id);
      renderBoard(); if (bd.open.has(id)) { const f = $('boardview').querySelector(`[data-draft="r:${CSS.escape(id)}"]`); if (f) f.focus({ preventScroll: true }); if (!bd.replies[id]) await loadReplies(id); }
    } else if (t.dataset.pin) {
      const p = bd.posts.find(x => x.id === t.dataset.pin); if (!p) return;
      await API.setFlag(p.id, 'pinned', !p.pinned); p.pinned = !p.pinned; bd.posts = sortPosts(bd.posts); renderBoard(); sr(p.pinned ? 'Pinned.' : 'Unpinned.');
    } else if (t.dataset.delpost) {
      const p = bd.posts.find(x => x.id === t.dataset.delpost); if (!p) return; const n = +p.reply_count || 0;
      if (!confirm(`Delete this post${n ? ` and its ${n} repl${n === 1 ? 'y' : 'ies'}` : ''}? This can't be undone.`)) return;
      t.disabled = true; await API.delPost(p.id); bd.posts = bd.posts.filter(x => x !== p); bd.open.delete(p.id); delete bd.replies[p.id]; renderBoard(); msg('Post deleted.', true);
    } else if (t.dataset.delrep) {
      const [pid, rid] = t.dataset.delrep.split('|'), p = bd.posts.find(x => x.id === pid);
      if (!confirm('Delete this reply? This can\'t be undone.')) return;
      await API.delReply(pid, rid); bd.replies[pid] = (bd.replies[pid] || []).filter(r => r.id !== rid); if (p) p.reply_count = Math.max(0, (+p.reply_count || 0) - 1); renderBoard(); sr('Reply deleted.');
    } else if (t.dataset.bd === 'older') {
      t.disabled = true; const r = await API.posts(bd.cursor); const nIds = new Set(r.list.map(p => p.id));
      bd.posts = bd.posts.concat(r.list.filter(p => !bd.posts.some(x => x.id === p.id))); bd.cursor = r.cursor; bd.more = r.more; renderBoard();
      const first = [...$('boardview').querySelectorAll('.post')].find(li => nIds.has(li.id.slice(5))); if (first) { first.setAttribute('tabindex', '-1'); first.focus(); }
    }
  } catch (er) { msg(errText(er)); renderBoard(); }
}
function wireSocial() {
  for (const box of [$('msgview'), $('boardview')]) {
    box.addEventListener('input', e => { const t = e.target.closest('[data-draft]'); if (!t) return; S.drafts[t.dataset.draft] = t.type === 'checkbox' ? t.checked : t.value; if (t.tagName === 'TEXTAREA') countChars(t); });
    box.addEventListener('change', e => { const t = e.target.closest('input[type=checkbox][data-draft]'); if (t) S.drafts[t.dataset.draft] = t.checked; });
    box.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches('textarea')) { e.preventDefault(); e.target.form.requestSubmit(); } });
    box.addEventListener('submit', e => {
      e.preventDefault(); const f = e.target, k = f.dataset.form;
      if (k === 'all') sendAllMsg(f); else if (k === 'mx' || k.startsWith('mx:')) sendMsg(f); else if (k === 'post') addPost(f); else if (k.startsWith('r:')) addReply(f, k.slice(2));
    });
  }
  $('msgview').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.open) openThread(t.dataset.open);
    else if (t.dataset.delmsg) deleteMsg(t.dataset.delmsg);
    else if (t.dataset.mx === 'all') { S.mx.compose = true; S.mx.open = ''; renderMessages(); const ta = $('msgview').querySelector('textarea'); if (ta) ta.focus(); }
    else if (t.dataset.mx === 'back') { S.mx.compose = false; S.mx.open = ''; renderMessages(); const b = $('msgview').querySelector('.mx-item'); if (b) b.focus(); }
    else if (t.dataset.mx === 'older') showOlderMsgs();

  $('boardview').addEventListener('click', boardClick);
  addEventListener('hashchange', () => { const v = hashView(); if (v && S.email && S.view !== v) { S.view = v; load(); } });
}
const hashView = () => { const v = location.hash.slice(1); return v === 'messages' || v === 'board' ? v : ''; };
function syncHash() {

// ---------- CSV ----------
function csv() {
  const cols = COLS[S.view].filter(c => c.t !== 'x'); const rows = visible();
  const cell = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const line = r => cols.map(c => { if (c.k === 'game') return cell(G[r.game] ? G[r.game].name : r.game); if (c.k === 'dateMs') return cell(r.dateMs ? new Date(r.dateMs).toLocaleString() : (r.date || '')); return cell(r[c.k]); }).join(',');
  const text = [cols.map(c => cell(c.h)).join(','), ...rows.map(line)].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' }));
  const cls = (S.classes.find(c => c.code === S.code) || {}).name || 'class';
  a.download = `${S.view}-${S.game}-${cls}-${ymd(new Date())}.csv`.replace(/[^\w.\-]+/g, '_'); document.body.appendChild(a); a.click(); a.remove();
}

function gate(html) { $('main').hidden = true; $('gate').hidden = false; $('gate').innerHTML = html; }

    $('g-go').disabled = true;
    try { const { auth, authMod } = await fbAuth(); const r = await authMod.signInWithPopup(auth, new authMod.GoogleAuthProvider()); await signedIn(String(r.user.email).toLowerCase()); }
    catch (e) { $('g-err').textContent = errText(e); $('g-go').disabled = false; }

async function isTeacherEmail(email) {
  if (TEACHER_EMAILS.includes(email)) return true;

}
async function signedIn(email) {

  if (!ok) {
    gate(`<h2 style="margin:0 0 10px">Not a teacher account yet</h2><p><b>${esc(email)}</b> isn't set up as a teacher. Open the Teacher dashboard in any of the games and request teacher access, then come back here once it's approved.</p>
      <div class="row"><button class="btn ghost" type="button" id="g-out">Sign out</button></div>`);

  $('gate').hidden = true; $('main').hidden = false;
  if (ADMIN_EMAILS.includes(email)) { checkRequests(); setInterval(() => { if (!document.hidden) checkRequests(); }, 120000); }

async function signOut() {
